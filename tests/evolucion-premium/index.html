<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="Planilla de registro defensivo de baloncesto para partidos en directo, sin cuentas ni servidor.">
  <title>Premium · propuesta aislada</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./evolucion.css">
  <script src="./muestra.js" defer></script><script src="./demo.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="header" aria-label="Datos y herramientas del partido">
      <div class="brand-line">
        <div class="brand">
          <h1>REGISTRO DEFENSIVO</h1>
        </div>
        <div id="saveStatus" class="save-status" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="saveStatusText">Demo · en memoria</span>
        </div>
      </div>
      <div class="toolbar">
        <label class="field field-game">
          <span>Partido</span>
          <select id="gameSelect" aria-label="Elegir partido"><option value="demo">Jornada 12 · Bilbao (muestra)</option></select>
        </label>
        <button type="button" id="newGameBtn" class="tool-button">+ Nuevo partido</button>
        <button type="button" id="deleteGameBtn" class="tool-button delete-game-button">Eliminar</button>
        <button type="button" id="undoBtn" class="tool-button undo-button" title="Eliminar el último registro del partido activo">
          <span aria-hidden="true">↶</span> Deshacer
        </button>
        <div class="toolbar-exports" aria-label="Copias y exportaciones">
          <button type="button" id="exportCsvBtn" class="tool-button">↓ Exportar CSV</button>
        </div>
      </div>
    </header>

    <main>
      
      <p id="configurationError" role="alert" hidden></p>
      <div class="top-grid">
        <section class="stat-panel" aria-labelledby="transitionTitle">
          <div class="panel-heading">
            <div>
              <h2 id="transitionTitle">TRANSICIÓN</h2>
            </div>
            <span class="panel-summary" id="transitionTotal">—</span>
          </div>
          <div id="transitionActions" class="action-list transition-list" aria-label="Acciones de transición"><button type="button" class="action-btn" data-category="transicion" data-action="transicion_bajo_aro"  data-key="transicion/transicion_bajo_aro/" aria-pressed="false"><span class="action-name">Bajo aro</span><span class="action-score">—</span></button><button type="button" class="action-btn" data-category="transicion" data-action="transicion_spot_up_3"  data-key="transicion/transicion_spot_up_3/" aria-pressed="false"><span class="action-name">Spot up 3</span><span class="action-score">—</span></button></div>
        </section>
        <section class="stat-panel" aria-labelledby="staticTitle">
          <div class="panel-heading">
            <div>
              <h2 id="staticTitle">ESTÁTICO</h2>
            </div>
            <span class="panel-summary" id="staticTotal">—</span>
          </div>
          <div id="staticActions" class="action-list static-list" aria-label="Acciones de estático"><button type="button" class="action-btn" data-category="estatico" data-action="estatico_1c1_exterior"  data-key="estatico/estatico_1c1_exterior/" aria-pressed="false"><span class="action-name">1c1 exterior</span><span class="action-score">—</span></button><button type="button" class="action-btn" data-category="estatico" data-action="estatico_1c1_interior"  data-key="estatico/estatico_1c1_interior/" aria-pressed="false"><span class="action-name">1c1 interior</span><span class="action-score">—</span></button><button type="button" class="action-btn" data-category="estatico" data-action="estatico_pin_down"  data-key="estatico/estatico_pin_down/" aria-pressed="false"><span class="action-name">Pin down</span><span class="action-score">—</span></button><button type="button" class="action-btn" data-category="estatico" data-action="estatico_cortes"  data-key="estatico/estatico_cortes/" aria-pressed="false"><span class="action-name">Cortes</span><span class="action-score">—</span></button><button type="button" class="action-btn" data-category="estatico" data-action="estatico_spot_up_3"  data-key="estatico/estatico_spot_up_3/" aria-pressed="false"><span class="action-name">Spot up 3</span><span class="action-score">—</span></button><button type="button" class="action-btn" data-category="estatico" data-action="estatico_bajo_aro"  data-key="estatico/estatico_bajo_aro/" aria-pressed="false"><span class="action-name">Bajo aro</span><span class="action-score">—</span></button></div>
        </section>
      </div>

      <section class="stat-panel direct-panel" aria-labelledby="directTitle">
        <div class="panel-heading">
          <div>
            <h2 id="directTitle">BLOQUEO DIRECTO</h2>
          </div>
          <span class="panel-summary" id="directTotal">—</span>
        </div>
        <div id="directActions" class="direct-list" aria-label="Defensas por tipo de bloqueo directo"><div class="direct-matrix"><div class="direct-matrix-inner"><div class="direct-matrix-head"><span class="direct-corner">Situación / defensa</span><div class="defense-headings"><span class="defense-heading" data-defense-heading="black">Black</span><span class="defense-heading" data-defense-heading="white">White</span><span class="defense-heading" data-defense-heading="blue">Blue</span><span class="defense-heading" data-defense-heading="red">Red</span><span class="defense-heading" data-defense-heading="tut">Tut</span></div></div><div class="direct-row" data-row="pr_manejador"><div class="direct-type"><strong>PR Manejador</strong><span data-action-summary="pr_manejador">—</span></div><div class="defense-options"><button type="button" class="defense-btn" data-category="directo" data-action="pr_manejador" data-strategy="black" data-key="directo/pr_manejador/black" aria-pressed="false"><span class="defense-name">Black</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_manejador" data-strategy="white" data-key="directo/pr_manejador/white" aria-pressed="false"><span class="defense-name">White</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_manejador" data-strategy="blue" data-key="directo/pr_manejador/blue" aria-pressed="false"><span class="defense-name">Blue</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_manejador" data-strategy="red" data-key="directo/pr_manejador/red" aria-pressed="false"><span class="defense-name">Red</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_manejador" data-strategy="tut" data-key="directo/pr_manejador/tut" aria-pressed="false"><span class="defense-name">Tut</span><span class="defense-score">—</span></button></div></div><div class="direct-row" data-row="pr_roller"><div class="direct-type"><strong>PR Roller</strong><span data-action-summary="pr_roller">—</span></div><div class="defense-options"><button type="button" class="defense-btn" data-category="directo" data-action="pr_roller" data-strategy="black" data-key="directo/pr_roller/black" aria-pressed="false"><span class="defense-name">Black</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_roller" data-strategy="white" data-key="directo/pr_roller/white" aria-pressed="false"><span class="defense-name">White</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_roller" data-strategy="blue" data-key="directo/pr_roller/blue" aria-pressed="false"><span class="defense-name">Blue</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_roller" data-strategy="red" data-key="directo/pr_roller/red" aria-pressed="false"><span class="defense-name">Red</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_roller" data-strategy="tut" data-key="directo/pr_roller/tut" aria-pressed="false"><span class="defense-name">Tut</span><span class="defense-score">—</span></button></div></div><div class="direct-row" data-row="pr_pop"><div class="direct-type"><strong>PR Pop</strong><span data-action-summary="pr_pop">—</span></div><div class="defense-options"><button type="button" class="defense-btn" data-category="directo" data-action="pr_pop" data-strategy="black" data-key="directo/pr_pop/black" aria-pressed="false"><span class="defense-name">Black</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_pop" data-strategy="white" data-key="directo/pr_pop/white" aria-pressed="false"><span class="defense-name">White</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_pop" data-strategy="blue" data-key="directo/pr_pop/blue" aria-pressed="false"><span class="defense-name">Blue</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_pop" data-strategy="red" data-key="directo/pr_pop/red" aria-pressed="false"><span class="defense-name">Red</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="pr_pop" data-strategy="tut" data-key="directo/pr_pop/tut" aria-pressed="false"><span class="defense-name">Tut</span><span class="defense-score">—</span></button></div></div><div class="direct-row" data-row="spain"><div class="direct-type"><strong>Spain</strong><span data-action-summary="spain">—</span></div><div class="defense-options"><button type="button" class="defense-btn" data-category="directo" data-action="spain" data-strategy="black" data-key="directo/spain/black" aria-pressed="false"><span class="defense-name">Black</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="spain" data-strategy="white" data-key="directo/spain/white" aria-pressed="false"><span class="defense-name">White</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="spain" data-strategy="blue" data-key="directo/spain/blue" aria-pressed="false"><span class="defense-name">Blue</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="spain" data-strategy="red" data-key="directo/spain/red" aria-pressed="false"><span class="defense-name">Red</span><span class="defense-score">—</span></button><button type="button" class="defense-btn" data-category="directo" data-action="spain" data-strategy="tut" data-key="directo/spain/tut" aria-pressed="false"><span class="defense-name">Tut</span><span class="defense-score">—</span></button></div></div></div></div></div>
      </section>
    </main>
  </div>

  <dialog id="newGameDialog" class="game-dialog" aria-labelledby="newGameTitle">
    <form id="newGameForm">
      <h2 id="newGameTitle">Nuevo partido</h2>
      <label class="dialog-field">Jornada
        <input id="roundInput" type="text" enterkeyhint="next" maxlength="32" required autocomplete="off">
      </label>
      <label class="dialog-field">Rival
        <input id="rivalInput" type="text" enterkeyhint="done" maxlength="80" required autocomplete="off">
      </label>
      <p id="newGameError" class="dialog-error" role="alert"></p>
      <div class="dialog-buttons">
        <button id="cancelNewGameBtn" type="button" class="tool-button">Cancelar</button>
        <button id="createGameBtn" type="submit" class="tool-button">Crear partido</button>
      </div>
    </form>
  </dialog>

  <dialog id="deleteGameDialog" class="game-dialog" aria-labelledby="deleteGameTitle" aria-describedby="deleteGameMessage">
    <h2 id="deleteGameTitle">Eliminar partido</h2>
    <p id="deleteGameMessage"></p>
    <p id="deleteGameError" class="dialog-error" role="alert"></p>
    <div class="dialog-buttons">
      <button id="cancelDeleteBtn" type="button" class="tool-button">Cancelar</button>
      <button id="confirmDeleteBtn" type="button" class="tool-button delete-confirm-button">Eliminar definitivamente</button>
    </div>
  </dialog>

  <footer class="result-dock" aria-label="Registrar resultado">
    <div class="result-inner">
      <div class="selection-line">
        <div class="selection-details">
          <span class="selection-label">ACCIÓN SELECCIONADA</span>
          <strong id="selectedDescription" aria-live="polite" aria-atomic="true">Selecciona una acción o defensa</strong>
        </div>
        <span class="selection-meta" id="gameTotal">0 intentos · —</span>
      </div>
      <div class="result-buttons" id="resultButtons">
        <button type="button" class="result-btn result-missed" data-points="2" data-result="fallado" aria-label="Tiro de 2 puntos fallado por el rival"><span>2<span class="result-sign">✕</span></span><small>FALLADO</small></button>
        <button type="button" class="result-btn result-missed" data-points="3" data-result="fallado" aria-label="Tiro de 3 puntos fallado por el rival"><span>3<span class="result-sign">✕</span></span><small>FALLADO</small></button>
        <button type="button" class="result-btn result-made" data-points="2" data-result="anotado" aria-label="Tiro de 2 puntos anotado por el rival"><span>2<span class="result-sign">✓</span></span><small>ANOTADO</small></button>
        <button type="button" class="result-btn result-made" data-points="3" data-result="anotado" aria-label="Tiro de 3 puntos anotado por el rival"><span>3<span class="result-sign">✓</span></span><small>ANOTADO</small></button>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </div>
  </footer>
</body>
</html>
