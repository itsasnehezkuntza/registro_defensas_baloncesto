<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dedede">
  <meta name="description" content="Registro defensivo de baloncesto con guardado local y cuenta de Google opcional.">
  <title>Registro defensivo · Baloncesto</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./premium.css">
  <link rel="stylesheet" href="./dashboard.css">
  <link rel="stylesheet" href="./cuenta.css">
  <script type="module" src="./app.js"></script>
  <script type="module" src="./js/cuenta-ui.js"></script>
</head>
<body><div class="ambient" aria-hidden="true"><div class="ambient-ribbon"></div><div class="ambient-ring"></div><div class="ambient-light"></div></div>
  <div class="app-shell">
    <header class="header" aria-label="Datos y herramientas del partido">
      <div class="brand-line">
        <div class="brand">
          <h1>REGISTRO DEFENSIVO</h1>
        </div>
        <div id="saveStatus" class="save-status is-saving" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="saveStatusText">Cargando…</span>
        </div>
      </div>
      <div class="toolbar">
        <label class="field field-game">
          <span>Partido</span>
          <select id="gameSelect" aria-label="Elegir partido" disabled><option value="">Selecciona o crea un partido</option></select>
        </label>
        <button id="viewToggle" type="button" class="tool-button view-toggle" aria-controls="registrationView statisticsView" aria-label="Ver estadísticas" disabled><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16M9 16v-5m5 5V6m5 10v-7"/></svg><span>Estadísticas</span></button>
        <button type="button" id="newGameBtn" disabled class="tool-button"><svg class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span>Nuevo partido</span></button>
        <button type="button" id="deleteGameBtn" disabled class="tool-button delete-game-button"><svg class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg><span>Eliminar</span></button>
        <button type="button" id="undoBtn" disabled class="tool-button undo-button" title="Eliminar el último registro del partido activo"><svg class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 7 7v3"/></svg><span>Deshacer</span></button>
        <div class="toolbar-exports" aria-label="Copias y exportaciones">
          <button type="button" id="exportCsvBtn" disabled class="tool-button"><svg class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg><span>Exportar CSV</span></button>
        </div>
      </div>
      <div class="account-bar" aria-label="Cuenta opcional">
        <span id="cloudStatus" class="cloud-status" role="status">Solo local</span>
        <span id="accountIdentity" class="account-identity" hidden></span>
        <button id="googleLogin" type="button" class="tool-button" disabled>Iniciar sesión con Google</button>
        <button id="googleLogout" type="button" class="tool-button" hidden>Cerrar sesión</button>
        <button id="accountRetry" type="button" class="tool-button" hidden>Reintentar conexión</button>
        <button id="continueLocal" type="button" class="tool-button" hidden>Continuar sin cuenta</button>
      </div>
      <p id="accountMessage" class="account-note" role="status" aria-live="polite" hidden></p>
    </header>

    <main>
      <p id="noGameNotice" class="no-game-notice" role="status">Selecciona o crea un partido para registrar acciones.</p>
      <p id="configurationError" role="alert" hidden></p>
      <div id="registrationView" aria-label="Registro">
      <div class="top-grid">
        <section class="stat-panel" aria-labelledby="transitionTitle">
          <div class="panel-heading">
            <div>
              <h2 id="transitionTitle"><span class="section-icon"><svg class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h14m-4-4 4 4-4 4M6 16h14m-10-4-4 4 4 4"/></svg></span><span class="category-title">TRANSICIÓN</span></h2>
            </div>
            <span class="panel-summary" id="transitionTotal">—</span>
          </div>
          <div id="transitionActions" class="action-list transition-list" aria-label="Acciones de transición"></div>
        </section>
        <section class="stat-panel" aria-labelledby="staticTitle">
          <div class="panel-heading">
            <div>
              <h2 id="staticTitle"><span class="section-icon"><svg class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 5v4h6V5M9 19v-4h6v4"/><circle cx="12" cy="12" r="1"/></svg></span><span class="category-title">ESTÁTICO</span></h2>
            </div>
            <span class="panel-summary" id="staticTotal">—</span>
          </div>
          <div id="staticActions" class="action-list static-list" aria-label="Acciones de estático"></div>
        </section>
      </div>

      <section class="stat-panel direct-panel" aria-labelledby="directTitle">
        <div class="panel-heading">
          <div>
            <h2 id="directTitle"><span class="section-icon"><svg class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 19V9a4 4 0 0 1 4-4h10m-4-4 4 4-4 4M12 11v8M9 14h6"/></svg></span><span class="category-title">BLOQUEO DIRECTO</span></h2>
          </div>
          <span class="panel-summary" id="directTotal">—</span>
        </div>
        <div id="directActions" class="direct-list" aria-label="Defensas por tipo de bloqueo directo"></div>
      </section>
      </div>
      <section id="statisticsView" class="dashboard" data-dashboard aria-label="Estadísticas del partido activo" hidden>
        <p id="statisticsState" class="dashboard-notice" role="status"></p>
        <div id="statisticsContent"></div>
        <p id="statisticsFeedback" class="feedback" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <dialog id="newGameDialog" class="game-dialog" aria-labelledby="newGameTitle">
    <form id="newGameForm">
      <h2 id="newGameTitle">Nuevo partido</h2>
      <label class="dialog-field">Jornada
        <input id="roundInput" type="text" enterkeyhint="next" maxlength="32" required autocomplete="off">
      </label>
      <label class="dialog-field">Rival
        <input id="rivalInput" type="text" enterkeyhint="done" maxlength="80" required autocomplete="off">
      </label>
      <p id="newGameError" class="dialog-error" role="alert"></p>
      <div class="dialog-buttons">
        <button id="cancelNewGameBtn" type="button" class="tool-button">Cancelar</button>
        <button id="createGameBtn" type="submit" class="tool-button">Crear partido</button>
      </div>
    </form>
  </dialog>

  <dialog id="deleteGameDialog" class="game-dialog" aria-labelledby="deleteGameTitle" aria-describedby="deleteGameMessage">
    <h2 id="deleteGameTitle">Eliminar partido</h2>
    <p id="deleteGameMessage"></p>
    <p id="deleteGameError" class="dialog-error" role="alert"></p>
    <div class="dialog-buttons">
      <button id="cancelDeleteBtn" type="button" class="tool-button">Cancelar</button>
      <button id="confirmDeleteBtn" type="button" class="tool-button delete-confirm-button">Eliminar definitivamente</button>
    </div>
  </dialog>

  <footer class="result-dock" aria-label="Registrar resultado">
    <div class="result-inner">
      <div class="selection-line">
        <div class="selection-details">
          <span class="selection-label">ACCIÓN SELECCIONADA</span>
          <strong id="selectedDescription" aria-live="polite" aria-atomic="true">Selecciona una acción o defensa</strong>
        </div>
        <span class="selection-meta" id="gameTotal">Fallados/aciertos · —</span>
      </div>
      <div class="result-buttons" id="resultButtons">
        <button type="button" class="result-btn result-missed" data-points="2" data-result="fallado" aria-label="Tiro de 2 puntos fallado por el rival" disabled><span>2<span class="result-sign">✕</span></span><small>FALLADO</small></button>
        <button type="button" class="result-btn result-missed" data-points="3" data-result="fallado" aria-label="Tiro de 3 puntos fallado por el rival" disabled><span>3<span class="result-sign">✕</span></span><small>FALLADO</small></button>
        <button type="button" class="result-btn result-made" data-points="2" data-result="anotado" aria-label="Tiro de 2 puntos anotado por el rival" disabled><span>2<span class="result-sign">✓</span></span><small>ANOTADO</small></button>
        <button type="button" class="result-btn result-made" data-points="3" data-result="anotado" aria-label="Tiro de 3 puntos anotado por el rival" disabled><span>3<span class="result-sign">✓</span></span><small>ANOTADO</small></button>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </div>
  </footer>
</body>
</html>
